[project]
name = "kx-plot"
version = "0.1.0"
description = "One-line matplotlib plots and themes for Kaggle notebooks."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff>=0.16.10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
    "ANN",
    "PT"
]
ignore = [
    "E701",
    "ANN401",
]
