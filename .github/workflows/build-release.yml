name: Build Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check tag against project.version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "${{ github.event_name }}" != "release" ]; then
            echo "::notice::manual run, skipping the tag check (version ${VERSION})"
            exit 0
          fi
          if [ "$TAG" != "v${VERSION}" ]; then
            echo "::error::release tag '$TAG' does not match project.version '$VERSION' in pyproject.toml"
            exit 1
          fi

  build:
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: uv build --out-dir dist

      - name: Check metadata renders on PyPI
        run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

  smoke-test:
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.14"]
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Install wheel
        run: python -m pip install dist/*.whl

      - name: Import and plot
        working-directory: ${{ runner.temp }}
        env:
          MPLBACKEND: Agg
        run: |
          python - <<'EOF'
          import kx

          assert "site-packages" in kx.__file__, kx.__file__
          assert {"dark", "light", "paper"} <= set(kx.styles()), kx.styles()
          assert "okabe" in kx.palettes(), kx.palettes()
          kx.use("dark", palette="okabe")
          df = kx.load("waves")
          kx.plot(df.iloc[:, 0], df.iloc[:, 1], "line-grid")
          print("kx OK from", kx.__file__)
          EOF

  attach-to-release:
    if: github.event_name == 'release'
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber --repo "${{ github.repository }}"
